# Sources:
# - https://tokenfactory.nebius.com/?modals=endpoint-details&model-id=Qwen/Qwen3.8-27B
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, context, max length)
# Accessed 2026-09-28.
# Serverless NVFP4 deployment (us-central1). Server reports model type text2text, so
# image/video input from the lab entry is narrowed to text-only here.
# Effort: reasoning_effort = none|low|medium|xhigh (none = thinking off). This is the
# model's native Qwen3.8 ladder, passed through the gateway's generic reasoning_effort
# field; off is effort=none, so no separate toggle.
# Served window: models_info max_model_len = 262_144 with no separate output cap, so
# output takes the full served window (context matches the lab entry).
# No discounted prompt-cache tier is published in the public catalog: cached and fresh
# input are billed identically, so cache_read = input (same rationale as
# DeepSeek-V4-Flash-0731 / Kimi-K3 / GLM-5.3).
base_model = "alibaba/qwen3.8-27b"
description = "Dense 27B reasoning model for coding, research, and long-horizon agent tasks"
attachment = false
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "xhigh"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.45
output = 3
cache_read = 0.45

[limit]
output = 262_144

[modalities]
input = ["text"]
