# Sources (accessed 2026-10-24):
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, max_model_len = 1_048_576, type image2text,
#   input_cached_price_per_million_tokens = 0.006)
# - https://tokenfactory.nebius.com/endpoints?modals=endpoint-details&model-id=deepseek-ai/DeepSeek-V4.1-Flash-1017
# Effort: reasoning_effort = none|low|high|max (none = thinking off). Same gateway behavior as the other
#   DeepSeek V4 entries on this host (DeepSeek-V4.1-Flash, DeepSeek-V4-Flash-0731): the mid tiers collapse
#   (minimal=low=medium, high=xhigh), leaving none/low/high/max as the distinct levels. Not probed on this
#   model (no key).
# Server reports model type image2text, so modalities are inherited from the lab entry.
# Served window: max_model_len = 1_048_576 with no separate output cap, so context and output both take the
#   full served window.
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response);
#   models_info lists "responses_api" in this model's use_cases.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
