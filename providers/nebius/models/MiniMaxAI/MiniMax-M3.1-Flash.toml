# Sources (accessed 2026-10-24):
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, max_model_len = 1_048_576, type image2text,
#   input_cached_price_per_million_tokens = 0.015)
# - https://tokenfactory.nebius.com/endpoints?modals=endpoint-details&model-id=MiniMaxAI/MiniMax-M3.1-Flash
# Modalities: catalog type image2text with use_cases text/image, so input is text + images; the lab's
#   video input is not listed for this host.
# Effort: reasoning_effort = low|medium|high|xhigh|max, copied from the lab API (providers/minimax) and
#   same-surface peers; thinking cannot be disabled on the lab API. Not probed on this host (no key).
# Served window: max_model_len = 1_048_576 with no separate output cap, so context and output both take the
#   full served window.
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response);
#   models_info lists "responses_api" in this model's use_cases.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
